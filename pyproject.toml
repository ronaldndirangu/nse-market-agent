[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-market-agent"
version = "0.1.0"
description = "Deterministic value screening agent for the Nairobi Securities Exchange"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "PyYAML>=6.0", "pypdf>=4.0", "Markdown>=3.5"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0"]

[project.scripts]
nse-agent = "nse_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["nse_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
