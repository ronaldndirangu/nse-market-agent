name: Monthly scorecard

on:
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      persisted: ${{ steps.commit.outputs.persisted }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Score logged picks against NASI
        run: python -m nse_agent score
      - name: Retrospective (forward scorecard and reverse attribution)
        run: python -m nse_agent retro
      - name: Walk-forward weight tuning (report only, never edits settings on main)
        run: python -m nse_agent tune-weights --proposal-file "$RUNNER_TEMP/weights.json" --body-file "$RUNNER_TEMP/tune.md"
      - name: Commit scorecard
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data
          if ! git diff --cached --quiet; then
            git commit -m "Monthly scorecard $(date -u +%F)"
            bash .github/scripts/push-main.sh
          fi
          echo "persisted=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the weight proposal PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: tune-weights
        run: |
          [ -f "$RUNNER_TEMP/weights.json" ] || { echo "Tuner keeps the current weights"; exit 0; }
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq length)
          if [ "$n" != "0" ]; then
            # A PR is under review: add a commit so its history stays intact instead of rewriting the branch.
            git fetch -q origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            python -m nse_agent apply-weights "$RUNNER_TEMP/weights.json"
            git add data/settings.yaml
            if git diff --cached --quiet; then
              echo "The open PR already proposes these weights"
            else
              git commit -m "Update proposed ranking weights $(date -u +%F)"
              git push origin "$BRANCH"
            fi
            gh pr edit "$BRANCH" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/tune.md"
          else
            git checkout -B "$BRANCH"
            python -m nse_agent apply-weights "$RUNNER_TEMP/weights.json"
            git add data/settings.yaml
            git commit -m "Propose ranking weights $(date -u +%F)"
            git push --force origin "$BRANCH"
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "Review proposed ranking weights $(date -u +%F)" --body-file "$RUNNER_TEMP/tune.md"
          fi

  deploy:
    needs: score
    if: ${{ !cancelled() && needs.score.outputs.persisted == 'true' }}
    uses: ./.github/workflows/publish.yml