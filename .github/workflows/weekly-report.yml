name: Weekly report

on:
  schedule:
    - cron: "7 14 * * 5" # Friday 17:07 EAT
  workflow_dispatch:
    inputs:
      fetch:
        description: "Refresh market data before valuing"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      persisted: ${{ steps.commit.outputs.persisted }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Value, rank and write the report
        env:
          NO_FETCH: ${{ github.event_name == 'workflow_dispatch' && !inputs.fetch && '--no-fetch' || '' }}
        run: |
          python -m nse_agent weekly $NO_FETCH --alert-file "$RUNNER_TEMP/changes.md" | tee "$RUNNER_TEMP/weekly.txt"
          python -m nse_agent brief --no-fetch
      - name: Commit the core report
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "Weekly report $(date -u +%F)"
            bash .github/scripts/push-main.sh
          fi
          echo "persisted=true" >> "$GITHUB_OUTPUT"
      - name: Prepare notification
        id: changes
        run: |
          if [ -s "$RUNNER_TEMP/changes.md" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          name: weekly-notification
          path: |
            ${{ runner.temp }}/changes.md
            ${{ runner.temp }}/weekly.txt
          retention-days: 7

  deploy:
    needs: report
    if: ${{ !cancelled() && needs.report.outputs.persisted == 'true' }}
    uses: ./.github/workflows/publish.yml

  analytics:
    needs: report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      persisted: ${{ steps.commit.outputs.persisted }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: simulation
        continue-on-error: true
        run: python -m nse_agent simulate
      - id: backtest
        continue-on-error: true
        run: python -m nse_agent backtest
      - id: score
        continue-on-error: true
        run: python -m nse_agent score
      - id: retrospective
        continue-on-error: true
        run: python -m nse_agent retro
      - name: Commit completed analytics
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "Weekly analytics $(date -u +%F)"
            bash .github/scripts/push-main.sh
          fi
          echo "persisted=true" >> "$GITHUB_OUTPUT"
      - name: Report analytics failures without blocking the core report
        if: >-
          always() && (steps.simulation.outcome == 'failure' || steps.backtest.outcome == 'failure' ||
          steps.score.outcome == 'failure' || steps.retrospective.outcome == 'failure')
        run: |
          echo "::error::Some analytics failed. The core weekly report can still publish."
          exit 1

  publish-analytics:
    needs: analytics
    if: ${{ !cancelled() && needs.analytics.outputs.persisted == 'true' }}
    uses: ./.github/workflows/publish.yml

  notify:
    needs: [report, deploy]
    if: needs.report.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weekly-notification
          path: notification
      - name: Notify about changed Buy or undervalued lists
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/weekly.html
        run: |
          {
            echo "Full report: $PAGES_URL"
            echo
            cat notification/changes.md
            echo
            echo "Generated by fixed rules from public data. Not financial advice."
          } > notification/issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "NSE weekly report $(date -u +%F)" \
            --body-file notification/issue.md
