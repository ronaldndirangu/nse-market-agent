name: Weekly report

on:
  schedule:
    - cron: "0 14 * * 5" # Friday 17:00 EAT
  workflow_dispatch:
    inputs:
      fetch:
        description: "Refresh market data before valuing"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Value, rank and write the report
        env:
          NO_FETCH: ${{ github.event_name == 'workflow_dispatch' && !inputs.fetch && '--no-fetch' || '' }}
        run: python -m nse_agent weekly $NO_FETCH | tee "$RUNNER_TEMP/weekly.txt"
      - name: Monte Carlo simulation
        run: python -m nse_agent simulate
      - name: Walk-forward backtest
        run: python -m nse_agent backtest
      - name: Score past picks
        run: python -m nse_agent score
      - name: Retrospective (forward scorecard and reverse attribution)
        run: python -m nse_agent retro
      - name: Commit report and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly report $(date -u +%F)"
          git pull --rebase
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Open notification issue
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/reports/latest.md
        run: |
          day=$(date -u +%F)
          {
            echo "Full report: $PAGES_URL"
            echo "Markdown: $REPORT_URL"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/weekly.txt"
            echo '```'
            echo
            echo "Generated by fixed rules from public data. Not financial advice."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "NSE weekly report $day" --body-file "$RUNNER_TEMP/issue.md"

  deploy:
    needs: report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
