name: Daily prices

on:
  schedule:
    - cron: "0 13 * * 1-5" # 16:00 EAT, one hour after the NSE close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Record closing prices and NASI
        run: python -m nse_agent daily
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No new prices"; exit 0; fi
          git commit -m "Daily prices $(date -u +%F)"
          git pull --rebase
          git push
