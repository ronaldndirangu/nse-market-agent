# Rule parameters. All numbers in the report come from code using these settings.
screen:
  min_avg_daily_turnover_kes: 1000000
  min_annual_periods: 3
  max_price_age_days: 7

valuation:
  horizon_years: 3
  growth_cap: 0.07
  growth_floor: 0.0
  min_ke_minus_g: 0.02
  mos_threshold: 0.15
  default_beta: 1.0
  beta_weeks: 156
  min_sector_peers: 3

buy:
  hurdle_premium_over_tbill: 0.05
  max_position_weight: 0.20
  max_sector_weight: 0.40

quality:
  piotroski_min: 0.5
  altman_distress: 1.1
  altman_safe: 2.6
  npl_rise_fail: 0.03
  npl_max: 0.25
  warning_lookback_days: 180

ranking:
  weights: {dividend_yield: 0.3, margin_of_safety: 0.1, momentum: 0.4, quality: 0.2}

scenarios:
  growth_shift: 0.02

simulation:
  block_weeks: 4
  paths: 5000
  seed: 20261111
  horizons_years: [1, 3, 5]
  stress_windows:
    - {name: "2016 rate cap shock", start: "2016-08-01", end: "2016-12-31"}
    - {name: "COVID crash", start: "2020-02-01", end: "2020-04-30"}
    - {name: "2023 sell-off", start: "2023-01-01", end: "2023-12-31"}

warning_keywords:
  - profit warning
  - cautionary
  - suspension
  - receivership
  - administration
  - delisting
