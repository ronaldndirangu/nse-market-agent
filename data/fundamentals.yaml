  TOTL:
    name: TotalEnergies Marketing Kenya Plc
    gaps:
    - shares_outstanding includes 454.477m redeemable preference shares, matching the printed EPS
    - No ebit or long_term_debt lines in the statements
    - Single-entity statements (Total Kenya / TotalEnergies Marketing Kenya files no group accounts), KShs thousands
      converted to millions. revenue = net sales after indirect taxes and duties. total_liabilities computed as
      non-current + current liabilities, which equals total assets - total equity for every period. shares_outstanding
      629.542m = 175.065m ordinary + 454.477m redeemable preference shares (repo convention); the printed EPS ties
      to profit / 629.542m in every year FY2016-FY2022.
    - 'ebit and long_term_debt omitted for all periods: the statements have no operating-profit subtotal, and no
      non-current borrowings exist (only short-term borrowings inside current liabilities, e.g. 6,200 in FY2022,
      748.6 in FY2019, 5,168.4 in FY2017, 3,804.2 in FY2016). Same treatment as the repo records.'
    - current_assets excludes 'non-current assets classified as held for sale' (24.364) for FY2017-FY2022, as presented.
      The original FY2016 report included that amount within trade receivables (current assets 25,379.5 as recorded);
      the FY2017 report restates FY2016 current assets to 25,355.1 with 24.364 shown separately. The FY2018 balance
      sheet (HY June 2019 report) shows no separate held-for-sale line, so 27,261.3 is as printed.
    - 'FY2018 is partial: no FY2018 or FY2019 annual results announcement is on nse.co.ke (media API searched for
      ''total kenya'', ''total kenya plc audited'' and ''2018''). The balance sheet comes from the 31 Dec 2018 comparative
      column of the HY June 2019 unaudited report (dated 29 Aug 2019). revenue, gross_profit, net_income, eps and
      operating_cash_flow omitted; net income is not back-derived from the retained-earnings movement because IFRS
      9 opening adjustments in 2018 could distort it. FY2018 dps 1.30 derived from ''Dividends declared - 2018''
      of 818,405 in the HY June 2019 equity statement / 629.542m.'
    - FY2019 and FY2022 are prior-year comparatives (FY2020 and FY2023 annual reports respectively); the original
      FY2019 and FY2022 announcements are not on nse.co.ke.
    - Most pre-2022 NSE files are scanned images; values were read from rendered page images (FY2016, FY2017, FY2018,
      FY2019, FY2020, FY2021) and cross-checked by the balance-sheet identity and EPS = profit / 629.542m.
    periods:
    - period: FY2025
      period_end: '2025-12-31'
      published: '2026-09-04'
