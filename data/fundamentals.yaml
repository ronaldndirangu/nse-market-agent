  SCBK:
    name: Standard Chartered Bank Kenya Ltd
    gaps:
    - EPS is on ordinary profit after preference dividends, so it differs from net_income / shares
    - total_equity includes about KES 2.8bn of preference shares and capital grants, so derived BVPS is slightly
      high
    - ROE is Cytonn-computed (the company prints none); H1-2026 NPL is press-release text quoted by media
    - H1-2026 omits shares_outstanding; core capital ratio is Bank level
    - EPS is on ordinary profit after KES 168m preference dividends, so it differs from net_income / shares (checked,
      (NI - 168) / shares matches EPS for every year)
    - FY2016-FY2019 EPS and shares are as originally published on 343.511m shares (before the 2020 1-for-10 bonus);
      AR2022 restates FY2019 EPS to 21.36 and FY2018 to 20.99
    - roe is computed as net_income / closing total_equity (the company prints none; its "return on capital employed"
      is a different measure)
    - cost_to_income is computed as operating expenses (excluding impairment) / operating income from the five-year
      summaries; the printed rounded ratio agrees
    - npl_ratio FY2022-FY2020 is computed from stage 3 / gross loans in the credit-quality tables; FY2019-FY2016
      are the printed five-year ratios, rounded to whole percent. The five-year table prints 15% for FY2020, which
      conflicts with the 10.1% stage-3 computation, so the computed value is used
    - FY2018 annual report not obtained; FY2018 values are comparatives in the FY2019 annual report, so they are
      post-IFRS 9 transition but not necessarily as originally published, and the publication date is the deadline
    - FY2019 dps 12.50 is the amount approved after the final dividend was cut from 15.00 to 7.50 because of COVID-19;
      the original declaration was 20.00
    - FY2016, FY2018 and FY2023 CBK-format statements are scanned images; annual reports used instead
    - core_capital_ratio is Bank level
