  BAT:
    name: British American Tobacco Kenya Plc
    gaps:
    - FY2025 final dividend 60 is proposed; AGM approval not verified
    - H1-2026 omits ebit, gross_profit and retained_earnings (not comparable or not printed)
    - Full annual reports on batkenya.com (and africanfinancials mirrors) return HTTP 403; every period is taken
      from the condensed audited results announcement filed on nse.co.ke (KShs millions).
    - 'gross_profit omitted for all periods: the announcements print only net revenue and a single ''cost of operations''
      line (total operating costs), no cost of sales or gross profit.'
    - 'long_term_debt omitted for all periods: the condensed balance sheet prints only total non-current liabilities
      (deferred tax, lease liabilities, etc.) with no borrowings line.'
