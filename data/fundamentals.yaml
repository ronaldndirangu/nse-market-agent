# Sourced fundamentals. Every value was read from the linked primary document; nothing is estimated.
# Units: KES millions, per-share in KES, ratios as decimals, shares in millions.
# published: when the figures were public. published_basis says how it was set:
#   noted     = date stated in the source
#   deadline  = CMA filing deadline (annual: period end + 4 months; interim: period end + 2 months)
#   retrieved = the deadline is later than the retrieval date, so the retrieval date is used
# Backtests only use a period on or after its published date. Update this file through PRs.
companies:
  SCOM:
    name: Safaricom Plc
    gaps:
    - Audited IFRS figures include the IAS 29 (Ethiopia hyperinflation) impact; press-release headline profit excludes
      it
    - H1-FY2027 is unaudited and reflects an IFRS 15 policy change, so comparatives may differ
    - H1-FY2027 omits dps, long_term_debt and gross_profit (not printed)
