    gaps:
    - Audited IFRS figures include the IAS 29 (Ethiopia hyperinflation) impact; press-release headline profit excludes
      it
    - H1-FY2027 is unaudited and reflects an IFRS 15 policy change, so comparatives may differ
    - H1-FY2027 omits dps, long_term_debt and gross_profit (not printed)
    - 'gross_profit omitted for all periods: Safaricom''s income statement prints no gross profit line (consistent
      with existing records).'
    - 'FY2017 not recorded: no FY2017 or FY2018 annual results file is on nse.co.ke (the media library jumps from
      the FY2016 release to the HY Sep 2018 release), safaricom.co.ke returns Incapsula 403, and the africanfinancials
      mirror returns Wordfence 403.'
    - FY2018-FY2020 come from releases printed in KShs billions to 2 decimals (precision about +/-5m); FY2021-FY2023
      are in KShs millions.
    - 'Accounting basis changes: FY2018 is IAS 18 / IAS 17 (prior-year comparative in the FY2019 release); FY2019
      is the IFRS 15 ''as reported'' column, pre-IFRS 16; FY2020 onward is IFRS 16.'
    - FY2018-FY2021 releases use a capital-employed balance sheet layout; total_assets (NCA + CA) and total_liabilities
      (NCL + CL) are computed and tie to equity exactly.
    - 'long_term_debt 0 for FY2018-FY2021: all bank borrowings are classified as current; FY2021 non-current liabilities
      (17,541.7) are not itemised and are not borrowings per the borrowings paragraph.'
    - operating_cash_flow missing for FY2018 (FY2019 release prints only free cash flow); FY2019 operating_cash_flow
      is the prior-year comparative in the FY2020 release.
    - FY2018 dps derived from the proposed dividend reserve; FY2019 dps includes the 0.62 special dividend.
    - EPS is printed to one decimal (FY2023 1.6, FY2022 1.7); net_income/shares gives 1.554 and 1.738, within the
      5% check against the rounded print.
    - total_liabilities + total_equity (parent) is lower than total_assets by the non-controlling interest (FY2023
      75,810.0; FY2022 40,232.3, mainly Safaricom Ethiopia); TL + parent equity + NCI ties exactly.
