        2,133.8), the same basis as the annual figures. net_income = equity holders of the parent (profit after
        tax incl. NCI is 50,351.1). Balance sheet is the condensed group SOFP at 30 Sep 2026; total_equity = equity
        attributable to the parent (total equity incl. NCI 236,320.4). The announcement notes a change in accounting
        policy (deferred SIM costs and connection revenue under IFRS 15). shares_outstanding is taken from the FY2026
        annual report because share capital is unchanged at 2,003.3 in the H1 SOFP. No interim dividend declaration
