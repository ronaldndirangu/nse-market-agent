notes:
- 'factor: multiply closes dated before ex_date by factor to make them comparable with closes on/after ex_date. null = not computed.'
- 'ex_date: first trading day on which the price trades ex-entitlement (the trading day after book closure where the repo price series shows the adjustment).'
- Ratio for bonus is new:held. Ticker renames with no share change (BBK to ABSA, Total to TotalEnergies, CFC Stanbic to Stanbic) need no factor and are not listed.
- Scan of all 16 repo price CSVs found no other one-day moves beyond +/-25% besides the jumps below (EABL 2022-10-14 is +23.2%, included because it was requested).
